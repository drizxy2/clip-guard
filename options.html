<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clip Guard - opções</title>
</head>
<body>
  <main>
    <h1>Clip Guard</h1>
    <section aria-labelledby="measurement-title">
      <h2 id="measurement-title">Medição local de alertas</h2>
      <p>Quando ativada, registra por origem somente nível, motivos e data de cada alerta. Esses registros ajudam a revisar possíveis falsos positivos; o texto copiado nunca é salvo.</p>
      <label>
        <input id="measurement-enabled" type="checkbox">
        Registrar alertas para medição local
      </label>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="export" type="button">Exportar JSON</button>
      <table>
        <thead>
          <tr><th scope="col">Origem</th><th scope="col">Nível</th><th scope="col">Motivos</th><th scope="col">Data</th></tr>
        </thead>
        <tbody id="measurements"></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="src/options.js"></script>
</body>
</html>
