<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle"></title>
</head>
<body>
  <main>
    <h1 data-i18n="optionsHeading"></h1>
    <section aria-labelledby="protection-title">
      <h2 id="protection-title" data-i18n="protectionHeading"></h2>
      <label for="protection-mode" data-i18n="detectionLabel"></label>
      <select id="protection-mode">
        <option value="block" data-i18n="modeBlock"></option>
        <option value="warn" data-i18n="modeWarn"></option>
      </select>
      <p data-i18n="modeDescription"></p>
      <label>
        <input id="free-confirmations-enabled" type="checkbox">
        <span data-i18n="freeConfirmationsLabel"></span>
      </label>
    </section>
    <section aria-labelledby="measurement-title">
      <h2 id="measurement-title" data-i18n="measurementHeading"></h2>
      <p data-i18n="measurementDescription"></p>
      <p><small data-i18n="copyDiagnosticNote"></small></p>
      <label>
        <input id="measurement-enabled" type="checkbox">
        <span data-i18n="measurementLabel"></span>
      </label>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="export" type="button" data-i18n="exportButton"></button>
      <table>
        <thead>
          <tr><th scope="col" data-i18n="originColumn"></th><th scope="col" data-i18n="levelColumn"></th><th scope="col" data-i18n="reasonsColumn"></th><th scope="col" data-i18n="dateColumn"></th></tr>
        </thead>
        <tbody id="measurements"></tbody>
      </table>
    </section>
    <section aria-labelledby="write-diagnostics-title">
      <h2 id="write-diagnostics-title" data-i18n="writeEventsHeading"></h2>
      <p data-i18n="writeEventsDescription"></p>
      <table>
        <thead>
          <tr><th scope="col" data-i18n="tabColumn"></th><th scope="col" data-i18n="originColumn"></th><th scope="col" data-i18n="methodColumn"></th><th scope="col" data-i18n="levelColumn"></th><th scope="col" data-i18n="resultColumn"></th><th scope="col" data-i18n="reasonsColumn"></th><th scope="col" data-i18n="dateColumn"></th></tr>
        </thead>
        <tbody id="write-diagnostics"></tbody>
      </table>
    </section>
  </main>
  <script src="src/compat.js"></script>
  <script type="module" src="src/options.js"></script>
</body>
</html>
